<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Moshe (demo)</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('moshe.ui') || '{}').prefs || {};
        if (p.appearance === 'light' || p.appearance === 'dark') document.documentElement.setAttribute('data-theme', p.appearance);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
