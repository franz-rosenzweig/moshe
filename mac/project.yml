# XcodeGen spec. Generates Moshe.xcodeproj from this file plus the Swift sources,
# so the project is reviewable text in git instead of an opaque bundle.
#   brew install xcodegen && xcodegen generate && open Moshe.xcodeproj
# build.sh reads the same settings and builds without Xcode.
name: Moshe
options:
  bundleIdPrefix: xyz.tiresia
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Moshe:
    type: application
    platform: macOS
    # a shared scheme, so `xcodebuild -scheme Moshe` and the Run button agree
    scheme:
      configVariants: []
    sources:
      - path: Moshe
    settings:
      base:
        PRODUCT_NAME: Moshe
        PRODUCT_BUNDLE_IDENTIFIER: xyz.tiresia.moshe
        MARKETING_VERSION: "0.2.2"
        CURRENT_PROJECT_VERSION: "4"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        # Local-only app: signing to run on this Mac is enough.
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        # The server Use the Server offers before an address is typed: none, unless
        # the build is given one (build.sh: MOSHE_DEFAULT_SERVER or local.env).
        MOSHE_DEFAULT_SERVER: ""
    info:
      path: Moshe/Info.plist
      properties:
        CFBundleName: Moshe
        CFBundleDisplayName: Moshe
        # XcodeGen otherwise writes 1.0 and 1, whatever the settings above say
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 the Moshe authors. Free software under the GNU GPL, version 3 or later."
        MosheDefaultServer: $(MOSHE_DEFAULT_SERVER)
        NSPrincipalClass: NSApplication
        # A server may be plain HTTP on a private network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    entitlements:
      path: Moshe/Moshe.entitlements
      properties:
        # Sandbox off: the library is a folder anywhere on this Mac (inside the
        # Obsidian vault), chosen once and kept as a path.
        com.apple.security.app-sandbox: false
