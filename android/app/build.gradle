// Moshe for Android: a WebView around the web app in frontend/, which is
// copied into the APK's assets at build time (build the web app first:
// cd ../frontend && npm ci && npm run build).
plugins {
    id 'com.android.application'
}

def web = file('../../frontend/dist')

// The server "The server's page" starts with before an address is typed: none,
// unless this build is given one, as moshe.defaultServer in android/local.properties
// (never in git) or -PmosheDefaultServer=https://….
def local = new Properties()
if (rootProject.file('local.properties').exists()) rootProject.file('local.properties').withInputStream { local.load(it) }
def defaultServer = (project.findProperty('mosheDefaultServer') ?: local.getProperty('moshe.defaultServer', '')).trim()

android {
    namespace 'xyz.tiresia.moshe'
    compileSdk 36

    defaultConfig {
        applicationId 'xyz.tiresia.moshe'
        minSdk 30
        targetSdk 36
        versionCode 7
        versionName '0.4.0'
        resValue 'string', 'app_name', 'Moshe'
        manifestPlaceholders = [shareAuthority: 'xyz.tiresia.moshe.share']
        buildConfigField 'String', 'DEFAULT_SERVER', '"' + defaultServer.replace('\\', '').replace('"', '') + '"'
    }

    buildFeatures {
        buildConfig true
    }

    // The signing key's properties: android/keystore.properties (never in git), or the
    // file -PsigningProperties names — Dvarim's, say, whose key signs Moshe too
    // (release.sh). storeFile, keyAlias, storePassword and, only if the key's
    // differs, keyPassword; storeFile is found beside the properties file.
    // Without one the release build is unsigned.
    def secrets = project.hasProperty('signingProperties')
            ? file(project.property('signingProperties')) : rootProject.file('keystore.properties')
    signingConfigs {
        release {
            if (secrets.exists()) {
                def props = new Properties()
                secrets.withInputStream { props.load(it) }
                def store = new File(props.getProperty('storeFile', 'android.keystore'))
                storeFile store.isAbsolute() ? store : new File(secrets.parentFile, store.path)
                storePassword props.getProperty('storePassword')
                keyAlias props.getProperty('keyAlias', 'moshe')
                keyPassword props.getProperty('keyPassword', props.getProperty('storePassword'))
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (secrets.exists()) signingConfig signingConfigs.release
        }
        debug {
            // beside the real app, with its WebView open to DevTools
            applicationIdSuffix '.debug'
            resValue 'string', 'app_name', 'Moshe dev'
            manifestPlaceholders = [shareAuthority: 'xyz.tiresia.moshe.debug.share']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs += layout.buildDirectory.dir('generated/web')
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    // the bridge's http op sends WebDAV's PROPFIND and MKCOL, which HttpURLConnection refuses
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}

// The web app, into assets/web/.
def copyWeb = tasks.register('copyWeb', Sync) {
    from web
    into layout.buildDirectory.dir('generated/web/web')
    doFirst {
        if (!new File(web, 'index.html').exists()) {
            throw new GradleException("no web build in ${web}: cd frontend && npm ci && npm run build")
        }
    }
}
tasks.named('preBuild') { dependsOn copyWeb }
